{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login card">
  <h1>Log in</h1>
  <form method="post">
    <div class="field"><label for="username">Username</label><input id="username" name="username" type="text"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password"></div>
    <button class="btn primary" type="submit">Log in</button>
  </form>
  <hr>
  <p class="note">Temporary preview: the real login is not built yet. Pick a role to see its screens.</p>
  <div class="role-buttons">
    {% for code, label in role_labels.items() %}<a class="btn" href="{{ url_for('auth.dev_role', role=code) }}">{{ label }}</a>{% endfor %}
  </div>
</div>
{% endblock %}
